name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_catalog.py
      - run: git diff --exit-code -- data/catalog.json
      - run: python scripts/validate_catalog.py
      - run: python scripts/render_markdown.py
      - run: python -m unittest discover -s tests -v
